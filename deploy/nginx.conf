server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # v3 routes, permanently moved in v4.
    location = /terminal       { return 301 /work; }
    location = /cloud-devops   { return 301 /expertise#cloud; }
    location = /ai-systems     { return 301 /agents; }
    location = /industrial-iot { return 301 /expertise#iiot; }
    location = /digital-twins  { return 301 /twins; }
    location = /journey        { return 301 /about; }
    location = /experience     { return 301 /about; }
    location = /commercials    { return 301 /engage; }

    # Strip trailing slashes so /work/ and /work resolve to the same page.
    rewrite ^/(.+)/$ /$1 permanent;

    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Next exports the OG image without an extension.
    location = /opengraph-image {
        include /etc/nginx/snippets/security-headers.conf;
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location ~* \.(?:css|js|woff2|png|jpg|jpeg|gif|svg|webp|ico|pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri.html $uri/index.html /index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
