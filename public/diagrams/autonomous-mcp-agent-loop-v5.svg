  <g transform="translate(490, 140)">
    <rect x="0" y="0" width="320" height="230" rx="14" fill="#0D1526" stroke="#8B5CF6" stroke-width="2" filter="url(#glowViolet)" />
    <rect x="0" y="0" width="320" height="38" rx="14" fill="#8B5CF6" fill-opacity="0.15" />
    <text x="16" y="24" fill="#C084FC" font-size="13" font-weight="700">02. LITELLM MULTI-MODEL ROUTER</text>
