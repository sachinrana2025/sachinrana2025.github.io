  <g transform="translate(490, 560)">
    <rect x="0" y="0" width="320" height="220" rx="14" fill="#0D1526" stroke="#10B981" stroke-width="2" filter="url(#glowCyan)" />
    <rect x="0" y="0" width="320" height="38" rx="14" fill="#10B981" fill-opacity="0.15" />
    <text x="16" y="24" fill="#34D399" font-size="13" font-weight="700">04. VERIFICATION &amp; DELIVERABLE</text>
    <circle cx="298" cy="19" r="4" fill="#10B981" />

    <g transform="translate(16, 50)">
      <rect x="0" y="0" width="288" height="44" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="18" fill="#F8FAFC" font-size="11" font-weight="600">Self-Correction &amp; AST Linters</text>
      <text x="12" y="32" fill="#10B981" font-family="monospace" font-size="9">Auto-detect syntax errors &amp; test failures</text>
