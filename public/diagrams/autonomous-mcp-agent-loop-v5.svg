    <g transform="translate(16, 102)">
      <rect x="0" y="0" width="288" height="44" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="18" fill="#F8FAFC" font-size="11" font-weight="600">Local Autonomous Tier (On-Prem GPU)</text>
      <text x="12" y="32" fill="#10B981" font-family="monospace" font-size="9">Qwen 2.5 32B // DeepSeek R1 // Ollama / vLLM</text>
    </g>

    <g transform="translate(16, 154)">
      <rect x="0" y="0" width="288" height="60" rx="6" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1" />
      <text x="12" y="18" fill="#C084FC" font-size="10" font-weight="700" font-family="monospace">GATEWAY POLICY CONTROLS</text>
      <text x="12" y="33" fill="#94A3B8" font-family="monospace" font-size="9">• Health Check &amp; Instant Auto-Failover</text>
      <text x="12" y="47" fill="#94A3B8" font-family="monospace" font-size="9">• Token Rate Limiting &amp; Cost Guardrails</text>
    </g>
  </g>

  <!-- Forward Flow 2 -> 3 -->
  <path d="M 810 270 C 880 300 930 350 990 380" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowV)" />
<circle class="ia-pkt" r="5" fill="#8B5CF6" color="#8B5CF6" opacity="0.95"><animateMotion dur="2.6s" begin="2.25s" repeatCount="indefinite" path="M 810 270 C 880 300 930 350 990 380"/></circle>

