      <text x="12" y="18" fill="#F8FAFC" font-size="11" font-weight="600">Real Execution Truth</text>
      <text x="12" y="32" fill="#64748B" font-family="monospace" font-size="9">Backed by tool output — never invented</text>
    </g>

    <g transform="translate(16, 154)">
      <rect x="0" y="0" width="288" height="52" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1" />
      <text x="12" y="18" fill="#34D399" font-size="10" font-weight="700" font-family="monospace">FINAL ARTIFACT DELIVERY</text>
      <text x="12" y="34" fill="#94A3B8" font-family="monospace" font-size="9">Git commits, deployed microservices, verified tests</text>
    </g>
  </g>

  <!-- Feedback Loop 4 -> 1 (Closing the loop) -->
  <path d="M 490 680 C 370 670 290 610 200 550" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowE)" />
<circle class="ia-pkt" r="5" fill="#10B981" color="#10B981" opacity="0.95"><animateMotion dur="2.6s" begin="3.15s" repeatCount="indefinite" path="M 490 680 C 370 670 290 610 200 550"/></circle>

  <!-- Center Core Badge: Autonomous Reflexive Kernel -->
  <g transform="translate(550, 420)">
    <rect x="-10" y="-30" width="220" height="60" rx="30" fill="#090D16" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="20" cy="0" r="5" fill="#06B6D4" filter="url(#glowCyan)" />
    <text x="35" y="-6" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CONTINUOUS</text>
    <text x="35" y="12" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="600">EVAL-ACT-REFLECT</text>
  </g>
</svg>