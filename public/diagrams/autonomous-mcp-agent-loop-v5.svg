      <text x="10" y="16" fill="#F8FAFC" font-size="10.5" font-weight="600">File Sandbox MCP</text>
      <text x="10" y="29" fill="#64748B" font-family="monospace" font-size="8.5">read_file, write_file, patch, AST</text>
    </g>

    <g transform="translate(14, 132)">
      <rect x="0" y="0" width="242" height="36" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="16" fill="#F8FAFC" font-size="10.5" font-weight="600">ClickHouse MCP Server</text>
      <text x="10" y="29" fill="#10B981" font-family="monospace" font-size="8.5">Direct SQL queries, Telemetry schema</text>
    </g>

    <g transform="translate(14, 174)">
      <rect x="0" y="0" width="242" height="36" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="16" fill="#F8FAFC" font-size="10.5" font-weight="600">A2A Swarm Delegation</text>
      <text x="10" y="29" fill="#F472B6" font-family="monospace" font-size="8.5">Subagents: Engineer, QA, Reviewer</text>
    </g>

    <g transform="translate(14, 216)">
      <rect x="0" y="0" width="242" height="50" rx="6" fill="#EC4899" fill-opacity="0.08" stroke="#EC4899" stroke-width="1" />
      <text x="10" y="16" fill="#F472B6" font-family="monospace" font-size="9" font-weight="bold">JSON-RPC 2.0 PROTOCOL</text>
      <text x="10" y="30" fill="#94A3B8" font-family="monospace" font-size="8.5">• stdio &amp; SSE transport pipes</text>
      <text x="10" y="42" fill="#94A3B8" font-family="monospace" font-size="8.5">• Strict schema validation</text>
    </g>
  </g>

  <!-- Forward Flow 3 -> 4 -->
  <path d="M 1040 570 C 970 650 880 670 800 680" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-dasharray="6 4" />
<circle class="ia-pkt" r="5" fill="#EC4899" color="#EC4899" opacity="0.95"><animateMotion dur="2.6s" begin="2.70s" repeatCount="indefinite" path="M 1040 570 C 970 650 880 670 800 680"/></circle>

