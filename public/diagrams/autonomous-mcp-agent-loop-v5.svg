    <circle cx="248" cy="18" r="3.5" fill="#EC4899" />

    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="242" height="36" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
