<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" style="background-color: #090D16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
<style>
path[stroke-dasharray]{animation:ia-flow 1.4s linear infinite}
@keyframes ia-flow{to{stroke-dashoffset:-20}}
.ia-pkt{filter:drop-shadow(0 0 4px currentColor)}
@media (prefers-reduced-motion: reduce){path[stroke-dasharray]{animation:none}.ia-pkt{display:none}}
</style>
  <defs>
    <pattern id="grid3" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.6" />
    </pattern>
    <radialGradient id="agentGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowV" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06B6D4" />
    </marker>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="1300" height="820" fill="#090D16" />
  <rect width="1300" height="820" fill="url(#grid3)" />
  <circle cx="650" cy="410" r="420" fill="url(#agentGlow)" />

  <!-- Diagram Header -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="1200" height="58" rx="10" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="24" cy="29" r="6" fill="#8B5CF6" filter="url(#glowViolet)" />
    <text x="42" y="26" fill="#F8FAFC" font-size="16" font-weight="700" letter-spacing="0.5">AUTONOMOUS AI &amp; MODEL CONTEXT PROTOCOL (MCP) AGENT LOOP</text>
    <text x="42" y="45" fill="#94A3B8" font-size="11" font-family="monospace">REASONING // LITELLM GATEWAY // MCP TOOL BUS // SELF-CORRECTION // VERIFIED ARTIFACTS</text>
    <g transform="translate(1040, 18)">
      <rect x="0" y="0" width="145" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1" />
      <circle cx="14" cy="11" r="3.5" fill="#8B5CF6" />
      <text x="26" y="15" fill="#A78BFA" font-size="9.5" font-family="monospace" font-weight="bold">HERMES RUNTIME</text>
    </g>
  </g>

  <!-- Central Cognitive Orbital Loop Path (Visual Background Loop) -->
  <g fill="none" stroke-width="2" opacity="0.4">
    <ellipse cx="650" cy="430" rx="460" ry="220" stroke="#1E293B" />
    <path d="M 190 430 A 460 220 0 0 1 650 210" stroke="#06B6D4" stroke-dasharray="8 6" />
<circle class="ia-pkt" r="5" fill="#06B6D4" color="#06B6D4" opacity="0.95"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" path="M 190 430 A 460 220 0 0 1 650 210"/></circle>
    <path d="M 650 210 A 460 220 0 0 1 1110 430" stroke="#8B5CF6" stroke-dasharray="8 6" />
<circle class="ia-pkt" r="5" fill="#8B5CF6" color="#8B5CF6" opacity="0.95"><animateMotion dur="2.6s" begin="0.45s" repeatCount="indefinite" path="M 650 210 A 460 220 0 0 1 1110 430"/></circle>
    <path d="M 1110 430 A 460 220 0 0 1 650 650" stroke="#EC4899" stroke-dasharray="8 6" />
<circle class="ia-pkt" r="5" fill="#EC4899" color="#EC4899" opacity="0.95"><animateMotion dur="2.6s" begin="0.90s" repeatCount="indefinite" path="M 1110 430 A 460 220 0 0 1 650 650"/></circle>
    <path d="M 650 650 A 460 220 0 0 1 190 430" stroke="#10B981" stroke-dasharray="8 6" />
<circle class="ia-pkt" r="5" fill="#10B981" color="#10B981" opacity="0.95"><animateMotion dur="2.6s" begin="1.35s" repeatCount="indefinite" path="M 650 650 A 460 220 0 0 1 190 430"/></circle>
  </g>

  <!-- ==================== NODE 1: TASK TRIGGER & PERCEPTION (LEFT) ==================== -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="250" height="240" rx="14" fill="#0D1526" stroke="#06B6D4" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="36" rx="14" fill="#06B6D4" fill-opacity="0.15" />
    <text x="14" y="23" fill="#38BDF8" font-size="12" font-weight="700">01. INTENT &amp; PERCEPTION</text>
    <circle cx="230" cy="18" r="3.5" fill="#06B6D4" />

    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="222" height="44" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="18" fill="#F8FAFC" font-size="11" font-weight="600">User Request &amp; System Event</text>
      <text x="10" y="32" fill="#64748B" font-family="monospace" font-size="9">CLI Prompt // Webhook // Alert</text>
    </g>

    <g transform="translate(14, 102)">
      <rect x="0" y="0" width="222" height="56" rx="6" fill="#111C33" stroke="#1E293B" stroke-width="1" />
      <text x="10" y="18" fill="#F8FAFC" font-size="11" font-weight="600">Hybrid Memory Context</text>
      <text x="10" y="32" fill="#06B6D4" font-family="monospace" font-size="8.5">Episodic MemOS // Fact Store</text>
      <text x="10" y="46" fill="#64748B" font-family="monospace" font-size="8.5">Workspace Discovery &amp; Git Head</text>
    </g>

    <g transform="translate(14, 166)">
      <rect x="0" y="0" width="222" height="60" rx="6" fill="#06B6D4" fill-opacity="0.08" stroke="#06B6D4" stroke-width="1" />
      <text x="10" y="18" fill="#38BDF8" font-size="10" font-weight="700" font-family="monospace">REASONING PHASE</text>
      <text x="10" y="34" fill="#E2E8F0" font-size="9.5">• Task Decomposition</text>
      <text x="10" y="49" fill="#E2E8F0" font-size="9.5">• Constraint &amp; Tool Selection</text>
    </g>
  </g>

  <!-- Forward Flow 1 -> 2 -->
  <path d="M 300 400 C 370 400 430 310 490 280" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowC)" />
<circle class="ia-pkt" r="5" fill="#06B6D4" color="#06B6D4" opacity="0.95"><animateMotion dur="2.6s" begin="1.80s" repeatCount="indefinite" path="M 300 400 C 370 400 430 310 490 280"/></circle>

